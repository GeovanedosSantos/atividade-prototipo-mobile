<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid black;
        }
        main {
            padding: 16px;
        }
        .profile {
            border-bottom: 1px solid black;
            padding-bottom: 24px;
            margin-bottom: 24px;
        }
        .profile__header {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .profile__photo {
            width: 80px;
            height: 80px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .profile__info {
            flex: 1;
        }
        .button {
            padding: 10px 16px;
        }
        .post {
            border: 1px solid black;
            padding: 16px;
            margin-bottom: 16px;
        }
        .post__status {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <strong>LOGO</strong>
        <button>
            ☰
        </button>
    </header>
    <main>
        <section class="profile">
            <div class="profile__header">
                <div class="profile__photo">
                    FOTO
                </div>
                <div class="profile__info">
                    <h1>
                        João da Silva
                    </h1>
                    <p>
                        joao@email.com
                    </p>
                </div>
            </div>
            <br>
            <button class="button">
                Editar perfil
            </button>
        </section>
        <section>
            <h2>
                Minhas publicações
            </h2>
            <article class="post">
                <h3>
                    Publicação publicada
                </h3>
                <p class="post__status">
                    Status: Publicado
                </p>
            </article>
            <article class="post">
                <h3>
                    Meu rascunho
                </h3>
                <p class="post__status">
                    Status: Rascunho
                </p>
            </article>
            <article class="post">
                <h3>
                    Publicação em análise
                </h3>
                <p class="post__status">
                    Status: Em revisão
                </p>
            </article>
        </section>
    </main>
</body>
</html>
