<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoria</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid black;
        }
        main {
            padding: 16px;
        }
        .filter {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }
        .filter select {
            padding: 10px;
        }
        .card {
            border: 1px solid black;
            padding: 12px;
            margin-bottom: 16px;
        }
        .card__image {
            height: 140px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }
        .load-more {
            width: 100%;
            padding: 12px;
        }
    </style>
</head>
<body>
    <header>
        <strong>LOGO</strong>
        <button>
            ☰
        </button>
    </header>
    <main>
        <h1>Tecnologia</h1>
        <section class="filter">
            <label for="filter">
                Filtrar por:
            </label>
            <select id="filter">
                <option>
                    Mais recentes
                </option>
                <option>
                    Mais antigos
                </option>
                <option>
                    Mais populares
                </option>
            </select>
        </section>
        <section>
            <article class="card">
                <div class="card__image">
                    IMAGEM
                </div>
                <h2>
                    Título da publicação
                </h2>
                <p>
                    Tecnologia · 01/09/2026
                </p>
            </article>
            <article class="card">
                <div class="card__image">
                    IMAGEM
                </div>
                <h2>
                    Outra publicação
                </h2>
                <p>
                    Tecnologia · 30/08/2026
                </p>
            </article>
            <article class="card">
                <div class="card__image">
                    IMAGEM
                </div>
                <h2>
                    Mais uma publicação
                </h2>
                <p>
                    Tecnologia · 28/08/2026
                </p>
            </article>
        </section>
        <button class="load-more">
            Carregar mais
        </button>
    </main>
</body>
</html>
