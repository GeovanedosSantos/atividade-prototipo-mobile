<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderação de comentários</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid black;
        }
        main {
            padding: 16px;
        }
        .comment {
            border: 1px solid black;
            padding: 16px;
            margin-bottom: 16px;
        }
        .comment__text {
            padding: 12px;
            border: 1px solid black;
            margin: 12px 0;
        }
        .comment__status {
            margin-bottom: 16px;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .button {
            padding: 10px 16px;
        }
        .button--primary {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <strong>LOGO</strong>
        <span>
            ADMIN
        </span>
        <button>
            ☰
        </button>
    </header>
    <main>
        <section>
            <h1>Moderação de comentários</h1>
            <article class="comment">
                <h2>
                    João da Silva
                </h2>
                <p class="comment__text">
                    Este é um comentário aguardando moderação.
                </p>
                <p class="comment__status">
                    Status: Pendente
                </p>
                <div class="actions">
                    <button class="button button--primary">
                        Aprovar
                    </button>
                    <button class="button">
                        Rejeitar
                    </button>
                </div>
            </article>
            <article class="comment">
                <h2>
                    Maria Souza
                </h2>
                <p class="comment__text">
                    Outro comentário aguardando análise.
                </p>
                <p class="comment__status">
                    Status: Pendente
                </p>
                <div class="actions">
                    <button class="button button--primary">
                        Aprovar
                    </button>
                    <button class="button">
                        Rejeitar
                    </button>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
