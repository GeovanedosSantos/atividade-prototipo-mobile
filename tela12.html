<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        main {
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login {
            width: 100%;
            max-width: 400px;
            border: 1px solid black;
            padding: 24px;
        }
        .login__logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form__input {
            width: 100%;
            padding: 12px;
            border: 1px solid black;
        }
        .button {
            padding: 12px;
        }
        .button--primary {
            font-weight: bold;
        }
        .alternative {
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <main>
        <section class="login">
            <div class="login__logo">
                <strong>LOGO</strong>
            </div>
            <h1>
                Entrar
            </h1>
            <form class="form">
                <label for="email">
                    E-mail
                </label>
                <input class="form__input" id="email" type="email" placeholder="Digite seu e-mail">
                <label for="password">
                    Senha
                </label>
                <input class="form__input" id="password" type="password" placeholder="Digite sua senha">
                <button class="button button--primary" type="submit">
                    Entrar
                </button>
            </form>
            <p class="alternative">
                Ou acesse utilizando outra opção.
            </p>
            <button class="button">
                Criar uma conta
            </button>
        </section>
    </main>
</body>
</html>
