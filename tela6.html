<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar publicação</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid black;
        }
        main {
            padding: 16px;
        }
        .post-editor {
            max-width: 700px;
            margin: auto;
        }
        .form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form__input,
        .form__textarea,
        .form__select {
            width: 100%;
            padding: 12px;
            border: 1px solid black;
        }
        .form__textarea {
            min-height: 200px;
            resize: vertical;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
        .button {
            padding: 12px;
        }
        .button--primary {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <strong>LOGO</strong>
        <button>
            ☰
        </button>
    </header>
    <main>
        <section class="post-editor">
            <h1>Criar publicação</h1>
            <form class="form">
                <label for="title">
                    Título
                </label>
                <input class="form__input" id="title" type="text" placeholder="Título da publicação">
                <label for="content">
                    Conteúdo
                </label>
                <textarea class="form__textarea" id="content" placeholder="Escreva o conteúdo..."></textarea>
                <label for="category">
                    Categoria
                </label>
                <select class="form__select" id="category">
                    <option>
                        Tecnologia
                    </option>
                    <option>
                        Ciência
                    </option>
                    <option>
                        Cultura
                    </option>
                </select>
                <label for="tags">
                    Tags
                </label>
                <input class="form__input" id="tags" type="text" placeholder="Ex.: tecnologia, programação">
                <label for="cover">
                    Imagem de capa
                </label>
                <input class="form__input" id="cover" type="file">
                <div class="actions">
                    <button class="button" type="button">
                        Salvar rascunho
                    </button>
                    <button class="button button--primary" type="submit">
                        Enviar para revisão
                    </button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
